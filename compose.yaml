# Local development services. The production-like stack (php-fpm, nginx, horizon,
# scheduler) is added in Milestone 9.
#
# You only need the `mariadb` service if you do not already run MySQL / MariaDB
# yourself (for example XAMPP). It has no root password and listens on localhost
# only: never use this configuration outside local development.
services:
    mariadb:
        image: mariadb:10.11
        environment:
            MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
            MARIADB_DATABASE: heavy
        command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
        volumes:
            - mariadb-data:/var/lib/mysql
            - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    # Chromium-based PDF renderer for permit documents (spec §8). Set GOTENBERG_URL.
    gotenberg:
        image: gotenberg/gotenberg:8
        ports:
            - '127.0.0.1:${FORWARD_GOTENBERG_PORT:-3000}:3000'

volumes:
    mariadb-data:
    redis-data:
