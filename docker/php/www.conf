; PHP-FPM pool of the "app" image, reached by nginx on port 9000.
[www]
listen = 9000

; Keep the container's environment (from compose env_file) visible to PHP.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Health check (Dockerfile HEALTHCHECK).
ping.path = /fpm-ping

access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
