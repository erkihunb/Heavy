# nginx in front of PHP-FPM. TLS is expected to end at the reverse proxy or
# load balancer in front of this container (set TRUSTED_PROXIES), which then
# forwards plain HTTP here.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    charset utf-8;

    # Receipt uploads (5 MB by default) plus the form.
    client_max_body_size 12m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite output has content hashes in its file names.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files /index.php =404;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        include fastcgi_params;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Never serve dot-files (.env, .git, …).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
